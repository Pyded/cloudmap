name: Update README catalog table

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-readme-main
  cancel-in-progress: true

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Generate README table
        run: python scripts/generate_readme.py

      - name: Commit generated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update catalog table"
          git push origin main
