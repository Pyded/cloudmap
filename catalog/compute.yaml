resources:
  - id: virtual_machine
    name: Виртуальная машина
    category: compute
    aliases:
      - vm
      - instance
    providers:
      evolution:
        service: Виртуальные машины
        resource: Виртуальная машина
        docs: https://cloud.ru/docs/virtual-machines/ug/index
        api: https://cloud.ru/docs/virtual-machines/ug/topics/api-ref
      advanced:
        service: Elastic Cloud Server
        resource: Elastic Cloud Server
        docs: https://cloud.ru/docs/en/usermanual/ecs/en-us_topic_0013771112
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Compute Cloud
        resource: Virtual Machine
        docs: https://yandex.cloud/ru/docs/compute/concepts/vm
        api: https://yandex.cloud/ru/docs/compute/api-ref/

  - id: vm_image
    name: Образ виртуальной машины
    category: compute
    aliases:
      - machine_image
      - image
    providers:
      evolution:
        service: Образы
        resource: Образ
        docs: https://cloud.ru/docs/images/ug/index
        api: https://cloud.ru/docs/virtual-machines/ug/topics/api-ref
      advanced:
        service: Image Management Service
        resource: Image
        docs: https://cloud.ru/docs/en/usermanual/ims/en-us_topic_0013901609
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Compute Cloud
        resource: Image
        docs: https://yandex.cloud/ru/docs/compute/concepts/image
        api: https://yandex.cloud/ru/docs/compute/api-ref/

  - id: vm_snapshot
    name: Снимок виртуальной машины
    category: compute
    aliases:
      - machine_snapshot
      - instance_snapshot
    providers: {}
