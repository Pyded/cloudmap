resources:
  - id: vpc
    name: Виртуальная частная сеть
    category: network
    aliases:
      - virtual_private_cloud
      - cloud_network
    providers:
      evolution:
        service: Evolution VPC
        resource: VPC
        docs: https://cloud.ru/docs/evolution-vpc/ug/index
        api: https://cloud.ru/docs/evolution-vpc/ug/topics/api-ref
      advanced:
        service: Virtual Private Cloud
        resource: VPC
        docs: https://cloud.ru/docs/en/usermanual/vpc/en-us_topic_0013748729
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Virtual Private Cloud
        resource: Network
        docs: https://yandex.cloud/ru/docs/vpc/concepts/network
        api: https://yandex.cloud/ru/docs/vpc/api-ref/

  - id: subnet
    name: Подсеть
    category: network
    aliases:
      - subnetwork
    providers:
      evolution:
        service: Подсети
        resource: Подсеть
        docs: https://cloud.ru/docs/subnets/ug/index
        api: https://cloud.ru/docs/evolution-vpc/ug/topics/api-ref
      advanced:
        service: Virtual Private Cloud
        resource: Subnet
        docs: https://cloud.ru/docs/en/usermanual/vpc/en-us_topic_0013748729
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Virtual Private Cloud
        resource: Subnet
        docs: https://yandex.cloud/ru/docs/vpc/concepts/network
        api: https://yandex.cloud/ru/docs/vpc/api-ref/

  - id: security_group
    name: Группа безопасности
    category: network
    aliases:
      - firewall_group
    providers:
      evolution:
        service: Группы безопасности
        resource: Группа безопасности
        docs: https://cloud.ru/docs/security-groups/ug/index
        api: https://cloud.ru/docs/evolution-vpc/ug/topics/api-ref
      advanced:
        service: Virtual Private Cloud
        resource: Security Group
        docs: https://cloud.ru/docs/en/usermanual/vpc/en-us_topic_0013748729
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Virtual Private Cloud
        resource: Security Group
        docs: https://yandex.cloud/ru/docs/vpc/concepts/security-groups
        api: https://yandex.cloud/ru/docs/vpc/api-ref/

  - id: public_ip
    name: Публичный IP-адрес
    category: network
    aliases:
      - external_ip
      - elastic_ip
    providers:
      evolution:
        service: Публичные IP
        resource: Публичный IP
        docs: https://cloud.ru/docs/public-ip/ug/index
        api: https://cloud.ru/docs/evolution-vpc/ug/topics/api-ref
      advanced:
        service: Elastic IP
        resource: EIP
        docs: https://cloud.ru/docs/en/usermanual/eip/overview_0001
        api: https://cloud.ru/docs/advanced/overview/advanced-en-api
      yandex:
        service: Virtual Private Cloud
        resource: Address
        docs: https://yandex.cloud/ru/docs/vpc/concepts/address
        api: https://yandex.cloud/ru/docs/vpc/api-ref/
